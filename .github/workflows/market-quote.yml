name: Refresh NBIS market quote
on:
  schedule:
    - cron: "0,30 13-21 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/market-quote.yml", "scripts/market/**"]

permissions:
  contents: write
concurrency:
  group: nbis-market-snapshot
  cancel-in-progress: false

jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pandas-market-calendars==5.1.3
      - id: session
        run: python scripts/market/session.py
      - uses: actions/setup-node@v4
        if: steps.session.outputs.start != ''
        with:
          node-version: 22
      - name: Update cached market snapshot
        if: steps.session.outputs.start != ''
        env:
          SESSION_START: ${{ steps.session.outputs.start }}
          SESSION_END: ${{ steps.session.outputs.end }}
        run: |
          npm install --prefix "$RUNNER_TEMP/quote" --no-audit --no-fund yahoo-finance2@3.11.2
          cp scripts/market/refresh.mjs "$RUNNER_TEMP/quote/"
          if git ls-remote --exit-code --heads origin market-data; then
            git fetch --depth=1 origin refs/heads/market-data:refs/remotes/origin/market-data
            git switch -c market-data origin/market-data
          else
            git switch --orphan market-data
          fi
          node "$RUNNER_TEMP/quote/refresh.mjs" nbis.json
          if test -f nbis.json; then
            git add nbis.json
            if ! git diff --cached --quiet; then
              git config user.name 'nbismodel-refresh'
              git config user.email 'nbismodel-refresh@users.noreply.github.com'
              git commit -m 'Refresh NBIS market snapshot [skip ci]'
              git push origin HEAD:refs/heads/market-data
            fi
          fi
